services:
  - type: web
    name: qualitypilot-api
    runtime: node
    rootDir: .
    buildCommand: npm install --include=dev && node_modules/.bin/nest build --config apps/api/nest-cli.json
    startCommand: node apps/api/dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
